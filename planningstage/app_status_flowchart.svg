<svg width="680" height="900" viewBox="0 0 680 900" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>What the app already has versus what it still needs</title>
<desc>Two-column flowchart: left column lists features already built and working, right column lists gaps that still need to be addressed before or during thesis defense.</desc>

<style>
  text { font-family: 'Segoe UI', Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 600; }
  .ts { font-size: 12px; font-weight: 400; }
  .heading { font-size: 16px; font-weight: 700; }
</style>

<rect x="0" y="0" width="680" height="900" fill="#ffffff"/>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<text class="heading" x="180" y="40" text-anchor="middle" fill="#04342C">Already solid</text>
<text class="heading" x="500" y="40" text-anchor="middle" fill="#4A1B0C">Still needed</text>

<!-- Left column: teal, already built -->
<g>
<rect x="60" y="60" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="180" y="83" text-anchor="middle" fill="#04342C">Auth and sessions</text>
<text class="ts" x="180" y="101" text-anchor="middle" fill="#0F6E56">Hashing, tokens, WS tickets</text>
</g>

<g>
<rect x="60" y="130" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="180" y="153" text-anchor="middle" fill="#04342C">Location privacy</text>
<text class="ts" x="180" y="171" text-anchor="middle" fill="#0F6E56">Blurred pickup pre-accept</text>
</g>

<g>
<rect x="60" y="200" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="180" y="223" text-anchor="middle" fill="#04342C">Ride lifecycle</text>
<text class="ts" x="180" y="241" text-anchor="middle" fill="#0F6E56">Request to complete, cancel, release</text>
</g>

<g>
<rect x="60" y="270" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="180" y="293" text-anchor="middle" fill="#04342C">Rate limiting</text>
<text class="ts" x="180" y="311" text-anchor="middle" fill="#0F6E56">Login and reset requests</text>
</g>

<g>
<rect x="60" y="340" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="180" y="363" text-anchor="middle" fill="#04342C">Realtime updates</text>
<text class="ts" x="180" y="381" text-anchor="middle" fill="#0F6E56">Per-ride and board sockets</text>
</g>

<g>
<rect x="60" y="410" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text class="th" x="180" y="433" text-anchor="middle" fill="#04342C">Password reset</text>
<text class="ts" x="180" y="451" text-anchor="middle" fill="#0F6E56">Admin-assisted, no paid SMS</text>
</g>

<!-- Right column: coral, still needed -->
<g>
<rect x="380" y="60" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="83" text-anchor="middle" fill="#4A1B0C">Persistent storage</text>
<text class="ts" x="500" y="101" text-anchor="middle" fill="#993C1D">Confirm disk survives restarts</text>
</g>

<g>
<rect x="380" y="130" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="153" text-anchor="middle" fill="#4A1B0C">HTTPS setup</text>
<text class="ts" x="500" y="171" text-anchor="middle" fill="#993C1D">Reverse proxy, TLS cert</text>
</g>

<g>
<rect x="380" y="200" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="223" text-anchor="middle" fill="#4A1B0C">Trust and safety</text>
<text class="ts" x="500" y="241" text-anchor="middle" fill="#993C1D">Ratings, reporting, driver ID</text>
</g>

<g>
<rect x="380" y="270" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="293" text-anchor="middle" fill="#4A1B0C">Ride request limits</text>
<text class="ts" x="500" y="311" text-anchor="middle" fill="#993C1D">Spam and abuse guardrails</text>
</g>

<g>
<rect x="380" y="340" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="363" text-anchor="middle" fill="#4A1B0C">Automated tests</text>
<text class="ts" x="500" y="381" text-anchor="middle" fill="#993C1D">None currently exist</text>
</g>

<g>
<rect x="380" y="410" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="433" text-anchor="middle" fill="#4A1B0C">Capacitor packaging</text>
<text class="ts" x="500" y="451" text-anchor="middle" fill="#993C1D">Not started yet</text>
</g>

<g>
<rect x="380" y="480" width="240" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.75"/>
<text class="th" x="500" y="503" text-anchor="middle" fill="#4A1B0C">WS reconnect handling</text>
<text class="ts" x="500" y="521" text-anchor="middle" fill="#993C1D">Board only, rides need it too</text>
</g>

<!-- Footer note -->
<g>
<rect x="60" y="580" width="560" height="70" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="0.75"/>
<text class="th" x="80" y="605" fill="#2C2C2A">For your thesis writeup</text>
<text class="ts" x="80" y="628" fill="#5F5E5A">Left column = defensible design decisions to cite as strengths.</text>
<text class="ts" x="80" y="644" fill="#5F5E5A">Right column = your remaining work plan, in rough priority order.</text>
</g>

</svg>
