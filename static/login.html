<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>

  <div class="app-container">
    <div class="route-board">🚌 Sign In</div>
    <p class="subtitle" id="mode-label">Log in to continue</p>

    <div class="btn-stack" style="flex-direction: row; margin-bottom: 16px;">
      <button class="btn-student" onclick="setRole('student')" id="role-student">I'm a Student</button>
      <button class="btn-driver" onclick="setRole('driver')" id="role-driver">I'm a Driver</button>
    </div>

    <div id="signup-fields" style="display:none;">
      <label>Full Name</label>
      <input type="text" id="name">
    </div>

    <label>Phone Number</label>
    <input type="text" id="phone" inputmode="tel" autocomplete="tel">

    <label>Password</label>
    <input type="password" id="password">

    <p id="forgot-password-link" style="margin: 8px 0 0; font-size: 13px;">
      <a href="#" onclick="toggleForgotPassword(); return false;">Forgot password?</a>
    </p>

    <div id="forgot-password-panel" style="display:none; margin-top: 16px; padding: 16px; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm);">
      <p style="margin: 0 0 8px; font-size: 13px; color: var(--ink-dim);">
        We don't have email/SMS reset set up yet — submit your phone number below and the admin will manually verify and reset your password.
      </p>
      <label>Phone Number</label>
      <input type="text" id="reset-phone" inputmode="tel" autocomplete="tel">
      <label>Message (optional)</label>
      <input type="text" id="reset-message" placeholder="Anything that helps confirm it's you">
      <button class="btn-secondary btn-block" style="margin-top: 12px;" id="reset-submit-btn" onclick="submitPasswordResetRequest()">Send Request</button>
    </div>

    <button class="btn-student btn-block" id="submit-btn" style="margin-top: 20px;" onclick="submitForm()">Log In</button>

    <p style="margin-top: 16px; font-size: 14px; color: var(--ink-dim);">
      <a href="#" id="toggle-mode" onclick="toggleMode()">New here? Sign up instead</a>
    </p>
  </div>

  <script>
    let role = 'student';
    let isSignup = false;

    function showToast(message, variant = 'warning', duration = 6000) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${variant}`;
      toast.innerHTML = `<span>${message}</span><button class="toast-close" aria-label="Dismiss">&times;</button>`;
      toast.querySelector('.toast-close').onclick = () => toast.remove();
      container.appendChild(toast);
      if (duration > 0) {
        setTimeout(() => toast.remove(), duration);
      }
    }

    function setRole(r) {
      role = r;
      document.getElementById('submit-btn').className = r === 'driver' ? 'btn-driver btn-block' : 'btn-student btn-block';
    }

    function toggleMode() {
      isSignup = !isSignup;
      document.getElementById('signup-fields').style.display = isSignup ? 'block' : 'none';
      document.getElementById('submit-btn').innerText = isSignup ? 'Sign Up' : 'Log In';
      document.getElementById('mode-label').innerText = isSignup ? 'Create an account' : 'Log in to continue';
      document.getElementById('toggle-mode').innerText = isSignup ? 'Already have an account? Log in' : 'New here? Sign up instead';
      // Forgot-password only makes sense when logging in, not signing up.
      document.getElementById('forgot-password-link').style.display = isSignup ? 'none' : 'block';
      if (isSignup) {
        document.getElementById('forgot-password-panel').style.display = 'none';
      }
    }

    function toggleForgotPassword() {
      const panel = document.getElementById('forgot-password-panel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    let isSubmittingReset = false;

    async function submitPasswordResetRequest() {
      if (isSubmittingReset) return;

      const phone = document.getElementById('reset-phone').value.trim();
      const message = document.getElementById('reset-message').value.trim();

      if (!phone) {
        showToast('Please enter your phone number.', 'warning');
        return;
      }

      isSubmittingReset = true;
      const btn = document.getElementById('reset-submit-btn');
      btn.disabled = true;

      try {
        const response = await fetch('/password-reset-requests', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, message: message || null })
        });

        let payload = null;
        try {
          payload = await response.json();
        } catch (err) {
          payload = null;
        }

        if (!response.ok) {
          const message = (payload && (payload.detail || payload.error))
            || (response.status === 429
                ? 'Too many requests. Please try again later.'
                : 'Something went wrong. Please try again.');
          showToast(typeof message === 'string' ? message : 'Something went wrong. Please try again.', 'error');
          return;
        }

        showToast('Request sent. We\'ll reach out once your identity is verified.', 'info', 8000);
        document.getElementById('reset-phone').value = '';
        document.getElementById('reset-message').value = '';
        document.getElementById('forgot-password-panel').style.display = 'none';
      } catch (err) {
        showToast('Could not reach the server. Check your connection and try again.', 'error');
      } finally {
        isSubmittingReset = false;
        btn.disabled = false;
      }
    }

    let isSubmitting = false;

    async function submitForm() {
      if (isSubmitting) return;

      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;

      if (!phone || !password) {
        showToast('Please fill in your phone number and password.', 'warning');
        return;
      }
      if (isSignup && !/^\+?[0-9\s\-().]{7,20}$/.test(phone)) {
        showToast('Please enter a valid phone number (digits only).', 'warning');
        return;
      }
      if (isSignup && !document.getElementById('name').value.trim()) {
        showToast('Please enter your full name.', 'warning');
        return;
      }
      isSubmitting = true;
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;

      try {
        let response;
        if (isSignup) {
          const name = document.getElementById('name').value.trim();
          response = await fetch('/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone, password, role })
          });
        } else {
          response = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone, password })
          });
        }

        let payload = null;
        try {
          payload = await response.json();
        } catch (err) {
          payload = null;
        }

        if (!response.ok) {
          // Rate limiting (429) comes back as {detail: "..."}. Pydantic
          // validation errors (422) come back as {detail: [{msg: "..."}]} —
          // an array, not a string. {error: "..."} covers the app's own
          // handled cases (wrong password, duplicate phone, etc).
          let message = null;
          if (payload) {
            if (typeof payload.error === 'string') {
              message = payload.error;
            } else if (typeof payload.detail === 'string') {
              message = payload.detail;
            } else if (Array.isArray(payload.detail) && payload.detail[0]) {
              message = payload.detail[0].msg || null;
            }
          }
          if (!message) {
            message = response.status === 429
              ? 'Too many attempts. Please wait a bit before trying again.'
              : `Something went wrong (error ${response.status}). Please try again.`;
          }
          showToast(message, 'error');
          return;
        }

        if (payload && payload.error) {
          showToast(payload.error, 'error');
          return;
        }

        goToApp(payload);
      } catch (err) {
        // Network failure, offline, server unreachable, etc.
        showToast('Could not reach the server. Check your connection and try again.', 'error');
      } finally {
        isSubmitting = false;
        submitBtn.disabled = false;
      }
    }

    function goToApp(user) {
      localStorage.setItem('user_id', user.id);
      localStorage.setItem('user_name', user.name);
      localStorage.setItem('user_role', user.role);
      localStorage.setItem('auth_token', user.token);

      if (user.role === 'driver') {
        window.location.href = 'driver.html';
      } else {
        window.location.href = 'student.html';
      }
    }
  </script>
</body>
</html>
